services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-n8n_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-n8n_password}
      - POSTGRES_DB=${DB_NAME:-n8n_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_user -d n8n_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  phpredisadmin:
    image: erikdubbelboer/phpredisadmin:latest
    restart: always
    environment:
      - REDIS_1_HOST=redis
      - REDIS_1_PORT=6379
    ports:
      - "8081:80"
    depends_on:
      redis:
        condition: service_healthy

  n8n-main:
    # image: n8nio/n8n:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: start
    ports:
      - "5678:5678"
    environment:
      - DB_POSTGRESDB_DATABASE=${DB_NAME:-n8n_db}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-n8n_password}
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${DB_USER:-n8n_user}
      - DB_TYPE=postgresdb
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-replace_this_with_a_long_random_string}
      - N8N_EXECUTION_MODE=queue
      - N8N_HOST=${DOMAIN_NAME:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  n8n-worker:
    # image: n8nio/n8n:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: worker
    environment:
      - DB_POSTGRESDB_DATABASE=${DB_NAME:-n8n_db}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-n8n_password}
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${DB_USER:-n8n_user}
      - DB_TYPE=postgresdb
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-replace_this_with_a_long_random_string}
      - N8N_EXECUTION_MODE=queue
      - QUEUE_BULL_REDIS_DB=5
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - n8n-main

  # tunnel:
  #   container_name: cloudflared-tunnel
  #   image: cloudflare/cloudflared:latest
  #   restart: always
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  #   depends_on:
  #     - n8n-main

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://n8n-main:5678
    restart: always

volumes:
  postgres_data:
  redis_data:
  n8n_data:
